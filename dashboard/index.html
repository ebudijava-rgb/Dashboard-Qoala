<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard Qoala Gadget Protection</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="shell">
  <aside id="side">
    <div class="side-brand">
      <span class="logo-badge"><img src="assets/logo.webp" alt="Qoala"></span>
    </div>
    <nav class="side-nav">
      <a href="#/summary" data-route="summary"><span class="dot"></span>Summary</a>
      <a href="#/spa" data-route="spa"><span class="dot"></span>SPA</a>
      <a href="#/pa" data-route="pa"><span class="dot"></span>PA</a>
      <a href="#/promotor" data-route="promotor"><span class="dot"></span>Promotor</a>
    </nav>
    <div class="side-foot" id="sideFoot"></div>
  </aside>
  <div class="scrim" id="scrim"></div>

  <div class="main">
    <header class="topbar">
      <div class="wrap topbar-in">
        <div class="brand">
          <button id="burger" aria-label="Menu">☰</button>
          <div>
            <div class="eyebrow" id="eyebrow">SALES MONITORING · SUMMARY</div>
            <h1 id="pageTitle">Qoala Gadget Protection x MAP Tech</h1>
            <p class="sub" id="periodSub">Memuat data…</p>
          </div>
        </div>
        <div class="top-actions">
          <button id="btnReset" class="btn ghost">Reset filter</button>
          <button id="btnCsv" class="btn primary">Unduh CSV bulanan</button>
        </div>
      </div>
    </header>

    <main class="wrap">
      <section class="card filters">
        <div class="card-h">
          <h2>Filter</h2>
          <span class="hint" id="filterCount"></span>
        </div>
        <div class="grid-f">
          <label>Tahun<select id="fYear"></select></label>
          <label>Bulan<select id="fMonth"></select></label>
          <label>Insurance<select id="fIns"></select></label>
          <label>Partner<select id="fPart"></select></label>
          <label id="lblAm">AM<select id="fAm"></select></label>
          <label id="lblSpa">SPA<select id="fSpa"></select></label>
          <label id="lblPa">PA<select id="fPa"></select></label>
          <label id="lblProm">Promotor<select id="fProm"></select></label>
          <label>Produk<select id="fProd"></select></label>
          <label>Store<select id="fStore"></select></label>
          <label>Status polis<select id="fStatus"></select></label>
        </div>
      </section>

      <div id="pageHead"></div>
      <div id="pageBody"></div>

      <footer class="foot"><span id="metaLine"></span></footer>
    </main>
  </div>
</div>

<script src="data/summary.js"></script>
<script src="app.js"></script>
</body>
</html>
